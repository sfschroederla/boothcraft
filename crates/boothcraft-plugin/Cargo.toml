[package]
name = "boothcraft-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# An in-process fake plugin format (gain, delay, scripted failures) for tests and development.
mock = []

[dependencies]
boothcraft-dsp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
thiserror.workspace = true

[dev-dependencies]
assert_no_alloc = "1"

[[bin]]
name = "bc-scan-worker-mock"
path = "src/bin/scan_worker_mock.rs"
required-features = ["mock"]
